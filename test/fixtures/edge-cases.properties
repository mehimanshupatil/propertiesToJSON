# Edge cases from docs/java-properties-format.md, compared against Java by test/java-compat.test.ts.
# Some lines rely on exact white space (trailing spaces, tabs, blank lines with spaces); keep it intact.

# §3 comments
# a comment ending in a backslash does not continue \
comment.not.continued=yes
! a bang comment

# §2 the next two lines contain only spaces / a tab and form feed
   
	 

# §3 no inline comments
hash.in.value=a # b

# §4 line continuation
continued.value=hel\
    lo
even.backslashes=C:\\
after.even=8080
odd.backslashes=1\\\
b
empty.continuation=1\

after.empty=2
hash.on.continuation=a\
# not a comment
fruits                           apple, banana, pear, \
                                 cantaloupe, watermelon, \
                                 kiwi, mango

# §5 key
escaped.backslash\\=x
\:\==x
key\ with\ space=v
cheeses

# §6 separator
space.separated value here
tab.separated	value
Truth = Beauty
Truth2                    :Beauty
double.eq==v
spaced.double = = v

# §7 value (the next line ends in three spaces)
trailing.spaces=hello   
escaped.leading.space=\ lead
url=http://example.com:8080/path

# §8 escapes
unicode=\u00e9\u0041
escaped.backslash.before.u=\\u0041
named.escapes=tab\tnl\nff\fcr\r
unknown.escapes=\b\z\"
